apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: db-statefulset
  namespace: todo-app

spec:
  selector:
    matchLabels:
      app: db-todo-app
  serviceName: db-service
  replicas: 1
  template:
    metadata:
      labels:
        app: db-todo-app
    spec:
      containers:
      - name: psql
        image: postgres:17
        ports:
        - containerPort: 5432

        env:
        - name: POSTGRES_DB
          valueFrom: 
            configMapKeyRef:
              name: todo-app-configmap
              key: POSTGRES_DB
        
        - name: POSTGRES_USER
          valueFrom: 
            configMapKeyRef:
              name: todo-app-configmap
              key: POSTGRES_USER
        
        - name: POSTGRES_PASSWORD
          valueFrom: 
            secretKeyRef:
              name: db-secret
              key: POSTGRES_PASSWORD
        
        volumeMounts:
        - name: app-data
          mountPath: /var/lib/postgresql/data
      
      volumes:
      - name: app-data
        persistentVolumeClaim:
          claimName: todo-app-pvc
